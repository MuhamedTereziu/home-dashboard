<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-AIO Control Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #070a13;
            --bg-indigo: #0c0e22;
            --card-bg: rgba(13, 17, 39, 0.45);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-hover: rgba(99, 102, 241, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.3);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.3);
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-primary);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Animated background mesh */
        .mesh-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 30%, rgba(99, 102, 241, 0.05) 0%, transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(167, 139, 250, 0.05) 0%, transparent 65%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 4rem);
        }

        /* Header section */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3.5rem;
            position: relative;
        }

        .brand-section {
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #818cf8, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.2));
            margin-bottom: 0.2rem;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Top status area */
        .status-section {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .sys-status {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(13, 17, 39, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 16px;
            font-size: 0.88rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .dot-pulse {
            width: 8px;
            height: 8px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .dot-pulse.online {
            background-color: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2.5s infinite;
        }

        .dot-pulse.offline {
            background-color: var(--danger);
            box-shadow: 0 0 10px var(--danger);
        }

        #clock {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.5rem 1rem;
            border-radius: 16px;
        }

        /* Control Panel bar: Search, Tabs & Settings */
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1.25rem;
            margin-bottom: 2.5rem;
            background: rgba(13, 17, 39, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 0.75rem 1.25rem;
            backdrop-filter: blur(12px);
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.6rem 1.1rem;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .tab-btn.active, .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
        }
        .tab-btn.active {
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 320px;
            min-width: 200px;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 0.65rem 1rem 0.65rem 2.5rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .action-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: var(--text-primary);
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 1.05rem;
        }

        .btn-action:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
            transform: scale(1.05);
        }

        /* Cards Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3.5rem;
            flex-grow: 1;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 1.75rem;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        /* Subtle glowing card back-highlights */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(800px circle at var(--mouse-x, 0) var(--mouse-y, 0), rgba(255, 255, 255, 0.03), transparent 40%);
            z-index: 2;
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--card-border-hover);
            background: rgba(16, 20, 48, 0.6);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35), 
                        0 0 20px rgba(99, 102, 241, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.25rem;
            position: relative;
            z-index: 3;
        }

        .icon-wrapper {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            transition: all 0.3s ease;
        }

        .card:hover .icon-wrapper {
            transform: scale(1.1) rotate(3deg);
        }

        /* Custom Icon Colors based on Category/Service */
        .icon-photos { background: rgba(59, 130, 246, 0.12); color: #60a5fa; box-shadow: 0 0 15px rgba(59, 130, 246, 0.15); }
        .icon-media { background: rgba(245, 158, 11, 0.12); color: #fbbf24; box-shadow: 0 0 15px rgba(245, 158, 11, 0.15); }
        .icon-torrent { background: rgba(16, 185, 129, 0.12); color: #34d399; box-shadow: 0 0 15px rgba(16, 185, 129, 0.15); }
        .icon-files { background: rgba(6, 182, 212, 0.12); color: #22d3ee; box-shadow: 0 0 15px rgba(6, 182, 212, 0.15); }
        .icon-system { background: rgba(139, 92, 246, 0.12); color: #a78bfa; box-shadow: 0 0 15px rgba(139, 92, 246, 0.15); }
        .icon-games { background: rgba(236, 72, 153, 0.12); color: #f472b6; box-shadow: 0 0 15px rgba(236, 72, 153, 0.15); }

        .card-status {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.3rem 0.65rem;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-checking {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
        }
        .status-online {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            box-shadow: inset 0 0 0 1px rgba(16, 185, 129, 0.15);
        }
        .status-offline {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            box-shadow: inset 0 0 0 1px rgba(239, 68, 68, 0.15);
        }

        .status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
        }
        .status-checking .status-dot { background: var(--text-secondary); }
        .status-online .status-dot { 
            background: #34d399; 
            box-shadow: 0 0 6px #34d399;
        }
        .status-offline .status-dot { 
            background: #f87171; 
        }

        .card-body {
            position: relative;
            z-index: 3;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }

        .card p.desc {
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.5;
            margin-bottom: 1.25rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 0.75rem;
            margin-top: auto;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .card-footer span {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        /* Footer Utilities */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
            margin-top: 2rem;
        }

        .utils-links {
            display: flex;
            gap: 1.5rem;
        }

        .util-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.25s ease;
        }

        .util-link:hover {
            color: var(--text-primary);
        }

        .util-link i {
            font-size: 1rem;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .refresh-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* Redirect animation overlay */
        .redirect-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 6, 15, 0.92);
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .redirect-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .redirect-logo {
            font-size: 4.5rem;
            color: #ffffff;
            text-shadow:
                0 0 15px rgba(255, 255, 255, 0.6),
                0 0 30px rgba(99, 102, 241, 0.8),
                0 0 50px rgba(99, 102, 241, 0.5);
            transform: scale(0.5);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .redirect-overlay.active .redirect-logo {
            transform: scale(1);
            opacity: 1;
            animation: pulseGlow 1.2s infinite alternate;
        }

        .redirect-text {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
            font-size: 0.9rem;
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s ease 0.2s;
        }

        .redirect-overlay.active .redirect-text {
            opacity: 1;
            transform: translateY(0);
        }

        /* Configuration Modals */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 6, 15, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #0f122c;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            width: 90%;
            max-width: 580px;
            padding: 2.25rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(99, 102, 241, 0.1);
            transform: scale(0.9);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.75rem;
        }

        .modal-header h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.3rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-control, select {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-primary);
            font-size: 0.92rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus, select:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.25rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            background: #4f46e5;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
            transform: translateY(-1px);
        }

        .settings-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .settings-item-row span {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .settings-item-row-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-item-action {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.35rem;
            font-size: 1rem;
            transition: color 0.2s ease;
        }

        .btn-item-action:hover {
            color: var(--text-primary);
        }

        .btn-item-delete:hover {
            color: var(--danger);
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.15); }
            100% { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 640px) {
            body {
                padding: 1.5rem 1rem;
            }
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1.25rem;
            }
            .status-section {
                width: 100%;
                justify-content: space-between;
            }
            .controls-row {
                flex-direction: column;
                align-items: stretch;
                border-radius: 18px;
            }
            .search-box {
                max-width: 100%;
            }
            .grid {
                grid-template-columns: 1fr;
            }
            footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="mesh-gradient"></div>

    <!-- Redirect overlay screen -->
    <div id="redirect-overlay" class="redirect-overlay">
        <i id="redirect-icon" class="redirect-logo"></i>
        <div id="redirect-text" class="redirect-text">INITIALIZING CONNECTIVITY...</div>
    </div>

    <div class="container">
        <header>
            <div class="brand-section">
                <h1>M-AIO Control</h1>
                <p class="subtitle">Private Server Cluster</p>
            </div>

            <div class="status-section">
                <div class="sys-status">
                    <div class="dot-pulse" id="sysIndicator"></div>
                    <span id="sysStatusText">Awaiting Ping...</span>
                </div>
                <div id="clock">00:00:00</div>
            </div>
        </header>

        <!-- Search, Tabs and Actions -->
        <div class="controls-row">
            <div class="tabs" id="categoryTabs">
                <button class="tab-btn active" data-category="all">All Services</button>
                <button class="tab-btn" data-category="media">Media & Cloud</button>
                <button class="tab-btn" data-category="downloads">Downloaders</button>
                <button class="tab-btn" data-category="system">Administration</button>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Search services...">
            </div>

            <div class="action-buttons">
                <button class="btn-action" id="btnSettings" title="Manage Services"><i class="fa-solid fa-sliders"></i></button>
                <button class="btn-action" id="btnAddService" title="Add New Service"><i class="fa-solid fa-plus"></i></button>
            </div>
        </div>

        <!-- Grid of Services -->
        <div class="grid" id="servicesGrid">
            <!-- Dynamically populated -->
        </div>

        <!-- Footer Utilities -->
        <footer>
            <div class="utils-links">
                <a href="https://targat.zya.me/" target="_blank" class="util-link">
                    <i class="fa-solid fa-car"></i> Vehicles
                </a>
            </div>

            <button class="refresh-btn" onclick="location.reload()" title="Refresh Dashboard">
                <i class="fa-solid fa-rotate-right"></i> Refresh
            </button>
        </footer>
    </div>

    <!-- settings list Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Manage Dashboard Services</h3>
                <button class="modal-close" onclick="closeModal('settingsModal')">&times;</button>
            </div>
            <div id="settingsServicesList" style="margin-bottom: 1.5rem;">
                <!-- Dynamically populated list of items to edit/delete -->
            </div>
            <div class="form-actions" style="margin-top: 0; padding-top: 1rem;">
                <button class="btn btn-secondary" onclick="closeModal('settingsModal')">Close</button>
                <button class="btn btn-primary" onclick="resetDefaultServices()">Reset Defaults</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Service Modal -->
    <div class="modal" id="serviceFormModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="formModalTitle">Add New Service</h3>
                <button class="modal-close" onclick="closeModal('serviceFormModal')">&times;</button>
            </div>
            <form id="serviceForm" onsubmit="saveServiceForm(event)">
                <input type="hidden" id="fieldId">
                <div class="form-group">
                    <label for="fieldName">Service Name</label>
                    <input type="text" id="fieldName" class="form-control" required placeholder="e.g. Jellyfin Media">
                </div>
                <div class="form-group">
                    <label for="fieldUrl">Access URL</label>
                    <input type="url" id="fieldUrl" class="form-control" required placeholder="https://5.mediii.qzz.io">
                </div>
                <div class="form-group">
                    <label for="fieldDesc">Description</label>
                    <input type="text" id="fieldDesc" class="form-control" placeholder="Brief subtitle explaining the service">
                </div>
                <div class="form-group">
                    <label for="fieldIcon">FontAwesome Icon Class</label>
                    <input type="text" id="fieldIcon" class="form-control" required placeholder="e.g. fa-solid fa-video">
                </div>
                <div class="form-group">
                    <label for="fieldTheme">Theme / Category Color</label>
                    <select id="fieldTheme">
                        <option value="icon-media">Orange (Media)</option>
                        <option value="icon-photos">Blue (Photos/Docs)</option>
                        <option value="icon-torrent">Green (Downloads)</option>
                        <option value="icon-files">Cyan (Files)</option>
                        <option value="icon-system">Purple (System)</option>
                        <option value="icon-games">Pink (Games)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fieldCategory">Category Section</label>
                    <select id="fieldCategory">
                        <option value="media">Media & Cloud</option>
                        <option value="downloads">Downloaders</option>
                        <option value="system">Administration</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('serviceFormModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Service</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Default services configuration mapping to user's exact Cloudflare Tunnel URLs
        const DEFAULT_SERVICES = [
            {
                id: "flood",
                name: "Flood",
                url: "https://0.mediii.qzz.io",
                desc: "High-speed torrent client and secure download manager.",
                icon: "fa-solid fa-download",
                theme: "icon-torrent",
                category: "downloads"
            },
            {
                id: "immich",
                name: "Immich",
                url: "https://1.mediii.qzz.io",
                desc: "Private media vault with AI recognition and automated encrypted backup.",
                icon: "fa-solid fa-images",
                theme: "icon-photos",
                category: "media"
            },
            {
                id: "cockpit",
                name: "Cockpit",
                url: "https://2.mediii.qzz.io/",
                desc: "Core server interface for Docker orchestration and hardware telemetry.",
                icon: "fa-solid fa-microchip",
                theme: "icon-system",
                category: "system"
            },
            {
                id: "stats",
                name: "Stats",
                url: "https://3.mediii.qzz.io",
                desc: "Infrastructure monitoring and real-time network traffic analytics.",
                icon: "fa-solid fa-chart-simple",
                theme: "icon-system",
                category: "system"
            },
            {
                id: "alist",
                name: "Alist",
                url: "https://4.mediii.qzz.io",
                desc: "Unified file gateway aggregating local and cloud storage pools.",
                icon: "fa-solid fa-folder-tree",
                theme: "icon-files",
                category: "media"
            },
            {
                id: "plex",
                name: "Plex",
                url: "https://5.mediii.qzz.io",
                desc: "Centralized media server for streaming movies and television series.",
                icon: "fa-solid fa-film",
                theme: "icon-media",
                category: "media"
            }
        ];

        let services = [];
        let activeCategory = "all";
        let searchQuery = "";

        // Initialize dashboard
        document.addEventListener("DOMContentLoaded", () => {
            loadServices();
            setupEventListeners();
            checkNetStatus();
            setInterval(checkNetStatus, 25000);
        });

        // Load services from localStorage or set defaults
        function loadServices() {
            const stored = localStorage.getItem("medi_server_services_v2");
            if (stored) {
                try {
                    services = JSON.parse(stored);
                } catch(e) {
                    services = [...DEFAULT_SERVICES];
                }
            } else {
                services = [...DEFAULT_SERVICES];
                localStorage.setItem("medi_server_services_v2", JSON.stringify(services));
            }
            renderServicesGrid();
        }

        // Setup event handlers
        function setupEventListeners() {
            // Category filter click handler
            document.getElementById("categoryTabs").addEventListener("click", (e) => {
                if (e.target.classList.contains("tab-btn")) {
                    document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
                    e.target.classList.add("active");
                    activeCategory = e.target.getAttribute("data-category");
                    renderServicesGrid();
                }
            });

            // Search input filter handler
            document.getElementById("searchInput").addEventListener("input", (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                renderServicesGrid();
            });

            // Add new service click
            document.getElementById("btnAddService").addEventListener("click", () => {
                openServiceFormModal();
            });

            // Settings click
            document.getElementById("btnSettings").addEventListener("click", () => {
                openSettingsModal();
            });
        }

        // Render cards grid
        function renderServicesGrid() {
            const grid = document.getElementById("servicesGrid");
            grid.innerHTML = "";

            const filtered = services.filter(service => {
                const matchesCategory = activeCategory === "all" || service.category === activeCategory;
                const matchesSearch = service.name.toLowerCase().includes(searchQuery) || 
                                      service.desc.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-secondary);">
                        <i class="fa-regular fa-folder-open" style="font-size: 2.5rem; margin-bottom: 1rem; display: block;"></i>
                        No services match your filters.
                    </div>
                `;
                return;
            }

            filtered.forEach(service => {
                const card = document.createElement("a");
                card.href = service.url;
                card.className = "card";
                card.dataset.id = service.id;

                // Mouse move effect for hover glow styling
                card.addEventListener("mousemove", (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    card.style.setProperty("--mouse-x", `${x}px`);
                    card.style.setProperty("--mouse-y", `${y}px`);
                });

                // Attach transition animation logic
                card.addEventListener("click", function(e) {
                    e.preventDefault();
                    triggerRedirectAnimation(service.url, service.name, service.icon);
                });

                card.innerHTML = `
                    <div class="card-header">
                        <div class="icon-wrapper ${service.theme}">
                            <i class="${service.icon}"></i>
                        </div>
                        <div class="card-status status-checking" id="status-${service.id}">
                            <div class="status-dot"></div>
                            <span>Checking</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div>
                            <h2>${service.name}</h2>
                            <p class="desc">${service.desc}</p>
                        </div>
                        <div class="card-footer">
                            <span><i class="fa-solid fa-arrow-up-right-from-square"></i> Connect</span>
                            <span>${new URL(service.url).hostname}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
                pingServiceStatus(service);
            });
        }

        // Check availability of a single service via fetch no-cors ping
        function pingServiceStatus(service) {
            const statusElement = document.getElementById(`status-${service.id}`);
            if (!statusElement) return;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 6000); // 6s timeout

            fetch(service.url, { mode: 'no-cors', signal: controller.signal })
                .then(() => {
                    clearTimeout(timeoutId);
                    statusElement.className = "card-status status-online";
                    statusElement.querySelector("span").textContent = "Online";
                })
                .catch(() => {
                    clearTimeout(timeoutId);
                    statusElement.className = "card-status status-offline";
                    statusElement.querySelector("span").textContent = "Offline";
                });
        }

        // Main network status check using the Alist favicon (https://4.mediii.qzz.io/favicon.ico)
        function checkNetStatus() {
            const indicator = document.getElementById("sysIndicator");
            const text = document.getElementById("sysStatusText");
            
            const img = new Image();
            img.src = "https://4.mediii.qzz.io/favicon.ico?v=" + Date.now();

            img.onload = () => {
                indicator.className = 'dot-pulse online';
                text.innerText = "System Online";
            };
            img.onerror = () => {
                indicator.className = 'dot-pulse offline';
                text.innerText = "System Offline";
            };
        }

        // Trigger the beautiful loading transition overlay screen
        function triggerRedirectAnimation(targetUrl, cardName, cardIconClass) {
            const overlay = document.getElementById('redirect-overlay');
            const overlayIcon = document.getElementById('redirect-icon');
            const overlayText = document.getElementById('redirect-text');

            overlayIcon.className = cardIconClass + ' redirect-logo';
            overlayText.innerText = `ESTABLISHING CONNECTION TO ${cardName.toUpperCase()}...`;

            overlay.classList.add('active');

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 1200);
        }

        // Clock Update
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('clock').innerText = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // BFCache Fix: Automatically hide the overlay if navigating backwards into the page
        window.addEventListener('pageshow', (event) => {
            const overlay = document.getElementById('redirect-overlay');
            if (overlay && overlay.classList.contains('active')) {
                overlay.classList.remove('active');
            }
        });

        // Open service edit/add modal
        function openServiceFormModal(service = null) {
            const form = document.getElementById("serviceForm");
            form.reset();

            if (service) {
                document.getElementById("formModalTitle").textContent = "Edit Service";
                document.getElementById("fieldId").value = service.id;
                document.getElementById("fieldName").value = service.name;
                document.getElementById("fieldUrl").value = service.url;
                document.getElementById("fieldDesc").value = service.desc;
                document.getElementById("fieldIcon").value = service.icon;
                document.getElementById("fieldTheme").value = service.theme;
                document.getElementById("fieldCategory").value = service.category;
            } else {
                document.getElementById("formModalTitle").textContent = "Add New Service";
                document.getElementById("fieldId").value = "";
            }

            document.getElementById("serviceFormModal").classList.add("active");
        }

        // Close modal helper
        function closeModal(id) {
            document.getElementById(id).classList.remove("active");
        }

        // Save new or updated service to list
        function saveServiceForm(event) {
            event.preventDefault();

            const id = document.getElementById("fieldId").value || "custom-" + Date.now();
            const name = document.getElementById("fieldName").value;
            const url = document.getElementById("fieldUrl").value;
            const desc = document.getElementById("fieldDesc").value;
            const icon = document.getElementById("fieldIcon").value;
            const theme = document.getElementById("fieldTheme").value;
            const category = document.getElementById("fieldCategory").value;

            const newService = { id, name, url, desc, icon, theme, category };
            const existingIndex = services.findIndex(s => s.id === id);

            if (existingIndex > -1) {
                services[existingIndex] = newService;
            } else {
                services.push(newService);
            }

            localStorage.setItem("medi_server_services_v2", JSON.stringify(services));
            closeModal("serviceFormModal");
            loadServices();
        }

        // Open settings panel list of services
        function openSettingsModal() {
            const listDiv = document.getElementById("settingsServicesList");
            listDiv.innerHTML = "";

            services.forEach(service => {
                const item = document.createElement("div");
                item.className = "settings-item-row";
                item.innerHTML = `
                    <span>${service.name}</span>
                    <div class="settings-item-row-buttons">
                        <button class="btn-item-action" onclick="editService('${service.id}')" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button class="btn-item-action btn-item-delete" onclick="deleteService('${service.id}')" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
                listDiv.appendChild(item);
            });

            document.getElementById("settingsModal").classList.add("active");
        }

        // Edit service handler inside settings
        function editService(id) {
            const service = services.find(s => s.id === id);
            if (service) {
                closeModal("settingsModal");
                openServiceFormModal(service);
            }
        }

        // Delete service handler inside settings
        function deleteService(id) {
            if (confirm("Are you sure you want to remove this service from your dashboard?")) {
                services = services.filter(s => s.id !== id);
                localStorage.setItem("medi_server_services_v2", JSON.stringify(services));
                openSettingsModal();
                loadServices();
            }
        }

        // Reset to default services list
        function resetDefaultServices() {
            if (confirm("Are you sure you want to reset the dashboard to the default services list? All custom additions will be lost.")) {
                services = [...DEFAULT_SERVICES];
                localStorage.setItem("medi_server_services_v2", JSON.stringify(services));
                closeModal("settingsModal");
                loadServices();
            }
        }
    </script>
</body>
</html>
